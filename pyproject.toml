[project]
name = "greek-inflexion-eee"
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "greek-accentuation",
    "inflexion>=0.8.0",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_inflexion_eee"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
