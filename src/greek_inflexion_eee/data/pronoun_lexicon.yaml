    GDF: τούτοιν
    GDN: τούτοιν
    DDM: τούτοιν
    DDF: τούτοιν
    DDN: τούτοιν
    NPM: οὗτοι
    NPF: αὗται
    NPN: ταῦτα
    GPM: τούτων
    GPF: τούτων
    GPN: τούτων
    DPM: τούτοις
