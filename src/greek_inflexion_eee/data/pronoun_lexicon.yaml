# Relative pronoun. One entry covers ὅς(M)/ἥ(F)/ὅ(N) -- not separate
# top-level ἥ:/ὅ: entries, matching how a regular adjective's stems:
# entry covers all three genders under one lemma key.
ὅς:
  forms:
    NSM: ὅς
    NSF: ἥ
    NSN: ὅ
    GSM: οὗ
    GSF: ἧς
    GSN: οὗ
    DSM: ᾧ
    DSF: ᾗ
    DSN: ᾧ
    ASM: ὅν
    ASF: ἥν
    ASN: ὅ
    NDM: ὥ
    NDF: ὥ
    NDN: ὥ
    ADM: ὥ
    ADF: ὥ
    ADN: ὥ
    GDM: οἷν
    GDF: οἷν
    GDN: οἷν
    DDM: οἷν
    DDF: οἷν
    DDN: οἷν
    NPM: οἵ
    NPF: αἵ
    NPN: ἅ
    GPM: ὧν
    GPF: ὧν
    GPN: ὧν
    DPM: [οἷς, οἷσι]  # οἷσι: epic (Od. I.32)
    DPF: αἷς
    DPN: οἷς
    APM: οὕς
    APF: ἅ̄ς
    APN: ἅ

# Interrogative "who?/what?" -- always accented (acute on first
# syllable throughout the paradigm), distinct from the enclitic
# indefinite τις below. One entry covers τίς(M/F, common gender)/τί(N);
# Morpheus itself does not distinguish a separate masculine vs feminine
# reading for this word (common-gender), so the M-labeled keys below
# hold the shared common-gender form, matching Smyth's own single
# "τίς" column for M/F combined. Unlike the M/F/N-distinguishing
# pronominal-declension lemmas above (where only Gen/Dat singular is
# masc=neut, fem stays distinct), τίς has NO gender distinction at all
# outside Nom/Acc -- Gen/Dat singular and Gen/Dat plural are one shared
# form across all three genders (Smyth's prints these as single,
# non-columned rows) -- so GSN/DSN/GPN/DPN below intentionally repeat
# the identical GSM/DSM/GPM/DPM values, not a masc-only omission. No
# distinct dual paradigm is given for this word in Smyth's Grammar.
τίς:
  forms:
    NSM: τίς
    NSN: τί
    GSM: τίνος
    GSN: τίνος
    DSM: τίνι
    DSN: τίνι
    ASM: τίνα
    ASN: τί
    NPM: τίνες
    NPN: τίνα
    GPM: τίνων
    GPN: τίνων
    DPM: τίσι(ν)
    DPN: τίσι(ν)
    APM: τίνας
    APN: τίνα

# Indefinite "someone/something" -- enclitic, unaccented in its citation
# form (except where accent rules force one). A distinct top-level entry
# from τίς above despite the near-identical spelling -- a genuine
# accent-based minimal pair (interrogative vs indefinite), not one lemma.
# Same common-gender-M-key convention as τίς, including the GSN/DSN/
# GPN/DPN masc=neut duplication (see τίς's comment above for why) and
# the same absence of a distinct dual paradigm in Smyth's Grammar.
τις:
  forms:
    NSM: τις
    NSN: τι
    GSM: τινός
    GSN: τινός
    DSM: τινί
    DSN: τινί
    ASM: τινά
    ASN: τι
    NPM: τινές
    NPN: τινά
    GPM: τινῶν
    GPN: τινῶν
    DPM: τισί(ν)
    DPN: τισί(ν)
    APM: τινάς
    APN: τινά

# Indefinite relative "whoever/whatever" = ὅς + τις compounded. One
# entry covers ὅστις(M)/ἥτις(F)/ὅ τι(N) -- the neuter is written as two
# words (ὅ τι, "sometimes printed ὅ, τι to avoid confusion with the
# conjunction ὅτι" per Smyth's), independently Morpheus-confirmed as the
# neuter singular of ὅς (ὅ) + the neuter singular of τις (τι) written
# together, matching how the whole lemma is itself compounded. Because
# the case/gender syncretism pattern belongs to the ὅς half of the
# compound (τις itself is common-gender and contributes no syncretism
# of its own), ὅστις mirrors ὅς's own masc=neut Gen/Dat-singular and
# fully-3-way-syncretic Gen-plural pattern, plus ὅς's genuinely distinct
# feminine Dat singular/plural (ᾗ/αἷς -> ᾗτινι/αἷστισι(ν), both
# independently Morpheus-confirmed, not just mechanically assumed):
# GSN=GSM, DSN=DSM, GPN=GPF=GPM, DPN=DPM (masc=neut); DSF and DPF are
# distinct forms, not copies of the masc/neut ones. No distinct dual
# paradigm is given for this word in Smyth's Grammar either.
ὅστις:
  forms:
    NSM: ὅστις
    NSF: ἥτις
    NSN: ὅ τι
    GSM: οὗτινος
    GSF: ἧστινος
    GSN: οὗτινος
    DSM: ᾧτινι
    DSF: ᾗτινι
    DSN: ᾧτινι
    ASM: ὅντινα
    ASF: ἥντινα
    ASN: ὅ τι
    NPM: οἵτινες
    NPF: αἵτινες
    NPN: ἅτινα
    GPM: ὧντινων
    GPF: ὧντινων
    GPN: ὧντινων
    DPM: οἷστισι(ν)
    DPF: αἷστισι(ν)
    DPN: οἷστισι(ν)
    APM: οὕστινας
    APF: ἅ̄στινας
    APN: ἅτινα

# Reciprocal "one another" -- genuinely defective: oblique cases only
# (no Nominative), dual and plural only (no Singular). Do not add
# Nominative or Singular cells here; test_allelon_has_no_nominative_or_singular
# asserts their absence outright.
ἀλλήλων:
  forms:
    GDM: ἀλλήλοιν
    GDF: ἀλλήλαιν
    GDN: ἀλλήλοιν
    DDM: ἀλλήλοιν
    DDF: ἀλλήλαιν
    DDN: ἀλλήλοιν
    ADM: ἀλλήλω
    ADF: ἀλλήλᾱ
    ADN: ἀλλήλω
    GPM: ἀλλήλων
    GPF: ἀλλήλων
    GPN: ἀλλήλων
    DPM: ἀλλήλοις
    DPF: [ἀλλήλαις, ἀλλήλῃσι]  # ἀλλήλῃσι: epic (Od. IX.22)
    DPN: ἀλλήλοις
    APM: ἀλλήλους
    APF: ἀλλήλᾱς
    APN: ἄλληλα
