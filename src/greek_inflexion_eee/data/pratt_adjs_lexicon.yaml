# Adjective lexicon for test_adjectives.py

ἀγαθός:
    stems:
        M: ἀγαθο
        F: ἀγαθη
        N: ἀγαθο
    accents:
        - ["..N", "ἀγαθός"]

ἄδικος:
    stems:
        M: ἀδικο
        F: ἀδικο
        N: ἀδικο
    accents:
        - ["..N", "ἄδικος"]

# Fem stems:/accents: mechanism gets 5 of 8 cells wrong here (confirmed via
# Perseids Morpheus, see tools/morpheus/query_morpheus.py): NSF/GSF/ASF/APF
# come out accented on the antepenult ("δίκαια" etc.) when the real forms
# shift the accent to the penult ("δικαία"), and GPF gets a wrong baked-in
# circumflex ("δικαιῶν" instead of "δικαίων") from noun_stemming.yaml's "1c"
# rule -- both are instances of the engine's inability to know a bare,
# undiacritized alpha's true (here, long) length, same root cause as
# ἐχθρός's GSF bug. DSF/NPF/DPF (and all masc/neut cells) are unaffected and
# stay on the mechanism; only the 5 wrong cells are overridden.
δίκαιος:
    stems:
        M: δικαιο
        F: δικαια
        N: δικαιο
    accents:
        - ["..N", "δίκαιος"]
    forms:
        NSF: δικαία
        GSF: δικαίας
        ASF: δικαίαν
        APF: δικαίας
        GPF: δικαίων

# αὐτός also serves as the 3rd-person pronoun (oblique-case him/her/it)
# and intensive "self"/"same" — declines as a regular adjective here and
# is intentionally NOT part of the "pronoun" POS/lexicon; it will not be
# discoverable via list_lemmas("pronoun").
αὐτός:
    stems:
        M: αὐτο
        F: αὐτη
        N: αὐτο
    accents:
        - ["..N", "αὐτός"]
    forms:
        NSN: αὐτό
        ASN: αὐτό

χρυσοῦς:
    forms:
        NSM: χρυσοῦς
        GSM: χρυσοῦ
        DSM: χρυσῷ
        ASM: χρυσοῦν
        NSF: χρυσῆ
        GSF: χρυσῆς
        NSN: χρυσοῦν
        GSN: χρυσοῦ

λύων:
    forms:
        NSM: λύων
        NSF: λύουσα
        NSN: λύον
        GSM: λύοντος
        GSF: λυούσης
        GSN: λύοντος

ταχύς:
    stems:
        M: ταχυ
    forms:
        NSF: ταχεῖα
        NSN: ταχύ
        ASN: ταχύ
        GSM: ταχέος
        GSF: ταχείας
        GSN: ταχέος

ἀληθής:
    stems:
        M: ἀληθεσ
        F: ἀληθεσ
        N: ἀληθεσ
    forms:
        NSN: ἀληθές
        ASN: ἀληθές
        DPN: ἀληθέσι(ν)
    accents:
        - ["..N", "ἀληθής"]

μείζων:
    forms:
        NSM: μείζων
        NSF: μείζων
        NSN: μεῖζον
        GSM: μείζονος
        GSF: μείζονος
        GSN: μείζονος
        DSM: μείζονι
        DSF: μείζονι
        DSN: μείζονι
        ASM: μείζονα
        ASF: μείζονα
        ASN: μεῖζον
