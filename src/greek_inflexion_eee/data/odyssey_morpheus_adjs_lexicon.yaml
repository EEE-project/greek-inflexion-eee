# odyssey_morpheus_adjs_lexicon.yaml — verbatim attested adjective forms for
# lemmas appearing in the created_with_eee Odyssey course vocabulary,
# confirmed via the Perseids Morpheus analyzer. Companion to
# odyssey_morpheus_verbs_lexicon.yaml — see that file's header for the full
# sourcing/verification methodology.
#
# The first adjective lexicon beyond "pratt" (the bundled teaching set of
# ~10 paradigm adjectives) — before this, load_adj_lexicons() had no named
# corpus lexicon comparable to what load_lexicons()/load_noun_lexicons()
# already offered for verbs/nouns. 49 lemmas here are Homeric adjectives
# the course vocabulary uses that Pratt's small teaching set never covered
# (e.g. πολύτροπος, the Odyssey's own opening epithet).
#
# πολύς ("much/many") shows unusually broad coverage (17 cells) because it's
# a suppletive adjective (πολύς/πολλή/πολύ, distinct stems by gender/case)
# not well handled by the pratt stem-based generator at all; several of its
# cells are genuinely ambiguous surface forms (e.g. πολλά is simultaneously
# a valid feminine dual and feminine singular and neuter plural nom/voc/acc
# reading — real accidental syncretism in the 1st/2nd declension pattern,
# confirmed independently by Morpheus for each reading, not query noise).
#
# Use merged alongside "pratt" (the required base), not standalone.
#
# Machine-generated 2026-07-11 — see odyssey_morpheus_verbs_lexicon.yaml
# header for methodology.

