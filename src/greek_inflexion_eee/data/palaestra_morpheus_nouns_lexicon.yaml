# palaestra_morpheus_nouns_lexicon.yaml — verbatim Morpheus-confirmed noun
# forms for the 27 distinct nouns in the created_with_eee Palaestra course
# vocabulary (ancient_greek.2026.summer, all 8 lessons through 2026_07_03).
# Every entry is a `forms:` block, never `stems:`.
#
# Different provenance from the odyssey_morpheus_* files (which start from
# forms already attested in a real text). Palaestra's own vocabulary TSVs
# only give the citation (nominative singular) form — there is no running
# text to harvest attested inflections from. So each noun's declension
# class was identified by hand from its citation form and (where the TSV
# gave one) its stated genitive singular — e.g. "ἡ δύσις, -εως" signals the
# πόλις-type 3rd-declension -ις/-εως pattern; "ἡ ἀνατολή, -ῆς" a regular 1st-
# declension -η noun — then all 8 standard case/number cells (nom/acc/gen/
# dat × sg/pl — the slots this course's paradigm_drill_widgets actually
# quizzes; Palaestra's verbs and adjectives never reach the inflexion
# engine at all, so no comparable verb/adjective lexicon was built) were
# generated from the regular pattern for that class and independently
# verified against Morpheus (lemma + pos=noun, or pos=adjective for the
# compound -ος agent-nouns the course glosses with an article as
# substantives — αὐτουργός, γεωργός, δοῦλος — which Morpheus's own citation
# dictionary classes as adjectives-used-substantively; the course's own
# article marking is the authority for treating them as nouns here).
# Candidate generation, not attestation-harvesting, is why this lexicon
# needed a synthetic-form generator + verifier rather than a query-the-
# running-text pipeline — every cell is still Morpheus-confirmed before
# inclusion, never a bare unverified guess.
#
# βοῦς (the 27th noun) has no entry here at all — every one of its 8 cells
# was already correctly covered by the existing pratt+homer+lsj+morpheus
# noun chain (its irregular root βο-/βου- paradigm was fully documented by
# the pre-existing "morpheus" lexicon), so there was nothing left to add.
# Of the other 26, only ὁ οἶκος/ὁ ἄνθρωπος were partially covered already
# (7 of 8 cells each) — their accusative plural is the one cell here,
# differing from the chain's existing output only in accent placement
# (οἴκους/ἀνθρώπους vs the chain's οἰκούς/ἀνθρωπούς). Every other lemma here
# was entirely absent from the prior chain (all 8 cells) — this course's
# everyday-prose vocabulary mostly isn't Homeric/Epic register.
#
# Use merged alongside "pratt" (the required base) or standalone via
# load_noun_lexicons(["palaestra_morpheus"]).
#
# Machine-generated 2026-07-11: candidate forms generated by hand from
# known declension patterns, then verified via direct Perseids Morpheus API
# queries, then cross-checked against the existing lexicon chain for
# genuine additive coverage.

