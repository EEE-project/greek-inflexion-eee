# morpheus_verbs_lexicon.yaml — verbatim attested verb forms, independently
# confirmed via the Perseids Morpheus analyzer, for lemmas the stem-based
# lexicons (pratt/ltrg/lsj/homer) can't handle cleanly: athematic -μι verbs,
# contract verbs, compounds, and deponents. Every entry is a `forms:` block
# (never `stems:`) — the exact attested surface form, not a reconstruction,
# so there is no stem-extraction/re-inflection risk for these irregulars.
#
# Sourcing: raw (form, UD-feats) pairs collected from the UD_Ancient_Greek-
# Perseus and UD_Ancient_Greek-PROIEL treebanks for each target lemma, each
# cell independently re-confirmed by querying Morpheus for that exact form
# and checking its returned lemma + tense/aspect + voice agree. Content
# skews Epic/Homeric register (the source treebanks and target vocabulary
# are Odyssey-derived) — this is deliberately a separate lexicon from lsj
# (Classical Attic), not merged into it; wire it alongside "homer", not
# alongside "lsj", when using it for a diachronic tab.
#
# Scope note: lemmas already well-covered (70+ cells) by pratt/ltrg's own
# stem-based generation (δίδωμι, δύναμαι, εἰμί, εἶμι, θνῄσκω, λέγω, χράομαι,
# ἐπίσταμαι, ἵημι, ἵστημι, ὁράω) are deliberately excluded here — adding
# overrides for them would be redundant, not a fix.
#
# Known limitations: (1) dual-number cells are stored here but won't surface
# through AncientGreekBackend.paradigm() — its verb-paradigm builder never
# enumerates dual person/number combinations (a pre-existing limitation, not
# specific to this lexicon); still directly reachable via
# GreekInflexion.generate(lemma, "...D") if a caller asks for that key
# explicitly. (2) Two participle rows (πλέω, ἵστημι) were dropped during
# generation — the source data didn't carry Case/Gender for them.
#
# Machine-generated from grc_paradigm_cache_final.tsv (Morpheus-confirmed
# treebank attestations) via build_morpheus_lexicon_yaml.py, 2026-07-10.
#
# Audited 2026-07-11 (tools/morpheus/audit_dial.py, fresh queries -- no raw
# cache existed from the original build): 7 mistagged cells removed --
# 3 Doric-only readings (λανθάνω, no epic alternative) and 4 outright wrong
# tags (κεῖμαι's number, and ἀχεύω's voice letter × 3 -- "P" isn't even a
# valid key for present/imperfect tense in stemming.yaml, only "A"/"M" are;
# the real matches use "M"). See tools/morpheus/README.md for the full
# noun+verb list and the two false-positive classes (deliberate spelling
# aliases; phonologically period-invariant α-stems) this audit had to rule
# out before trusting anything as a genuine bug.

