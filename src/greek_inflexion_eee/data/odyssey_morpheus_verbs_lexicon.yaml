# odyssey_morpheus_verbs_lexicon.yaml — verbatim attested verb forms for
# lemmas appearing in the created_with_eee Odyssey course vocabulary
# (lessons 2026_06_01 through 2026_07_06, 508 distinct word forms across
# 520 form+lemma+pos triples), confirmed via the Perseids Morpheus analyzer.
# Every entry is a `forms:` block, never `stems:`.
#
# Distinct provenance from "morpheus" (see that lexicon's own header):
# "morpheus" sources (form, UD-feats) pairs from the UD_Ancient_Greek
# treebanks, broadly, independent of any specific course. This lexicon
# instead starts from the Odyssey course's own vocabulary TSVs (the exact
# forms students actually meet in the assigned text), queries Morpheus
# directly for each one, verifies the returned lemma+pos agree with the
# TSV's own claim (accentuation/dialectal-spelling differences tolerated,
# e.g. νόος vs νοῦς — a genuinely different citation-form convention, not
# unified), then keeps only cells the FULL existing lexicon chain
# (pratt+dik+ltrg+lsj+homer+lxx+morphgnt+morpheus+byzantine merged) does not
# already generate correctly — i.e. genuine additive coverage, not a
# restatement of what's already reachable.
#
# Grave-accent forms from running text (a positional convention — Greek
# marks a non-phrase-final oxytone with grave instead of acute, not a
# distinct accent) are normalized back to acute citation-form spelling
# before storage; the acute form is what a paradigm-table cell should show.
#
# Some entries may look surprising next to a regularized teaching paradigm
# and are kept anyway because Morpheus independently confirms them as real
# Homeric/Epic attestations, not generation noise:
#   - εἰμί IAI.3P has two Morpheus-confirmed readings, ἔσαν (the expected
#     Homeric 3rd-plural alongside ἦσαν) and ἦν (a rarer but independently
#     attested alternate 3rd-plural, alongside its far more common 1st/3rd
#     singular reading) — stored as a 2-element list.
#   - βάλλω PAP.VSM: βάλλον — an archaic bare-stem vocative singular
#     participle, distinct from the nominative-leveled -ων vocative Pratt's
#     regularized Attic paradigm shows for this cell (cf. λύω PAP.VSM:
#     λύων in this package's own examples.rst).
#   - Dual-number cells are included where Morpheus confirms them; see
#     morpheus_verbs_lexicon.yaml's own header for the pre-existing
#     limitation that AncientGreekBackend.paradigm() doesn't enumerate
#     dual person/number combinations (still reachable via
#     GreekInflexion.generate(lemma, "...D") directly).
#
# Use merged alongside "homer" (or the full Odyssey chain), not standalone —
# same reasoning as morpheus_verbs_lexicon.yaml: this documents specific
# attested cells, not a self-contained stemming engine.
#
# Machine-generated 2026-07-11 from the Odyssey course's own lesson
# vocabulary TSVs via direct Perseids Morpheus API queries, cross-checked
# against the full existing lexicon chain for genuine additive coverage.

