# odyssey_morpheus_nouns_lexicon.yaml — verbatim attested noun forms for
# lemmas appearing in the created_with_eee Odyssey course vocabulary,
# confirmed via the Perseids Morpheus analyzer. Companion to
# odyssey_morpheus_verbs_lexicon.yaml — see that file's header for the full
# sourcing/verification methodology (course-vocabulary-driven, not treebank-
# driven like "morpheus"; grave-accent running-text forms normalized to
# acute citation spelling; only cells not already covered by the existing
# lexicon chain are included).
#
# βοῦς here documents its vocative singular/plural and nominative/vocative
# plural — real Homeric readings; note some of these are legitimately
# identical in surface form across case/number (βοῦς serving as both NPM
# and NPF, since the noun is common-gender).
#
# Use merged alongside "homer" (or the full Odyssey chain), not standalone.
#
# Machine-generated 2026-07-11 — see odyssey_morpheus_verbs_lexicon.yaml
# header for methodology.

