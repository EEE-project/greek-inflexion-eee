# 2026_07_13 gap-mining pass (2026-07-27) -- same methodology as the
# 2026_07_20 pass above. Skipped as documented non-fixes, not oversights:
# σφεῖς/μιν (3rd-person personal pronouns -- pronoun_lexicon.yaml's own
# header explicitly scopes these out, "3rd person routes through αὐτός");
# ὁ (the article -- never given standalone paradigm data anywhere in this
# package, validated contextually against its noun instead, not an
# independently quizzable lexeme); ἕκαστος (both cells -- TSV tags it
# pronoun here, but its existing cells already live under adjective in
# this file, same false-gap shape as αὐτός -- a routing/TSV-tagging
# question, not a lexicon-data gap); ὑλήεσσα/ὑλήεις (Morpheus confirms
