# Older-5-lessons gap-mining pass (2026-07-27) -- lessons 2026_06_01 through
# 2026_07_06, which had already been through the original 2026-07-11/12
# mining pass; this is the residual "long tail" the earlier pass's own
# framing anticipated. Same methodology, plus several new false-gap
# patterns caught this round (see the matching header note in
# odyssey_morpheus_adjs_lexicon.yaml for the full skip list and reasoning):
# the article (ὁ), πολύς (documented elsewhere as out of scope), σφεῖς/μιν
# (as before), σφέτερος/ὅσος/ἡμέτερος/οὐδείς (all confirmed by Morpheus to
# be regular adjective- or pronoun_lexicon-shaped words, but the course
# TSVs tag them pos=pronoun where the data would need to live under a
# different pos or lemma -- same routing-mismatch shape as αὐτός, left
# alone rather than unilaterally deciding a new architecture routing).
# Two genuine TSV lemma errors also found and left alone (not "fixed" with
# invented data): θεός/θεά (Morpheus does not recognize θεά as a form of
# θεός at all -- a real, distinct lemma) and σύ/τοι (Morpheus confirms τοι
# as the ordinary particle; the σύ-dative reading it also returns is
# Doric-only, inappropriate for Epic and vanishingly unlikely in context).
