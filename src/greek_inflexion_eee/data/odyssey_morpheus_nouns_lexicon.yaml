# 2026_07_20 gap-mining pass (2026-07-27) -- same methodology, this batch
# never went through a coverage pass before (course-vocab header note above
# predates this lesson's addition to the course). πρυμνήσιον: Morpheus's
# own analysis resolves the word to the adjective πρυμνήσιος used
# substantively (understood νηός πρυμνήσιος, "the [rope] of the stern");
