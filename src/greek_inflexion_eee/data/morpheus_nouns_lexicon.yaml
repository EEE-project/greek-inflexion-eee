# morpheus_nouns_lexicon.yaml — verbatim attested noun forms, independently
# confirmed via the Perseids Morpheus analyzer, for lemmas the stem-based
# lexicons (pratt/lsj) can't handle cleanly: non-2nd-declension nouns,
# oxytone nouns, and irregular/suppletive nouns (Ζεύς). Every entry is a
# `forms:` block (never `stems:`) — the exact attested surface form, not a
# reconstruction. Requires ancient-greek-backend-eee's gender-restriction
# fix (AncientGreekBackend._noun_genders) to render cleanly: that fix always
# trusts an explicit `forms:` override regardless of its own gender guess,
# which is what lets genuinely dual-gender nouns here (γείτων "neighbor",
# ἅλς "salt"/"sea", both real, documented homographs) show all their
# confirmed cells rather than being pruned to one guessed gender.
#
# Sourcing: same methodology as morpheus_verbs_lexicon.yaml (see its header)
# — UD_Ancient_Greek-Perseus + UD_Ancient_Greek-PROIEL treebanks, each cell
# independently re-confirmed against Morpheus. Content skews Epic/Homeric
# register; wire alongside "homer", not "lsj" (Classical Attic) — e.g.
# πόλις here is πολίων/πολίεσσιν (Epic), not lsj/pratt's πόλεως/πόλεσι(ν)
# (Attic).
#
# One row was dropped as a treebank annotation error, not a real dual-
# gender reading: γυνή ("woman", unambiguously feminine) had the identical
# surface form γυναικῶν tagged Gender=Fem in one treebank occurrence and
# Gender=Masc in another; the Masc tag doesn't correspond to any real usage.
#
# Machine-generated from grc_paradigm_cache_final.tsv (Morpheus-confirmed
# treebank attestations) via build_morpheus_lexicon_yaml.py, 2026-07-10.
#
# Audited 2026-07-11 (tools/morpheus/audit_dial.py, fresh queries -- no raw
# cache existed from the original build): 15 mistagged cells removed across
# 10 lemmas -- wrong gender (θεός, ναῦς, ὄρος), wrong number (πόλις, ἔτος,
# ἠώς), Attic/Doric-only contractions with no epic alternative (ῥόος, ἦμαρ),
# and Doric-only α-spellings of an otherwise -η paradigm (νύμφη, ψυχή).
# Two lemmas (θεά, ὥρα) show the same all-Attic/Doric/Aeolic `dial` pattern
# but were investigated and kept: both stems end in ε/ρ, so -α is their
# period-invariant spelling (the same phonological rule behind σκιά's
# dialect-general plural in palaestra_morpheus_nouns_lexicon.yaml), not a
# real restriction. See tools/morpheus/README.md for the full verb+noun list.

